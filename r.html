<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff4f8b,#ff75a6,#ff99c8,#ffd6e7);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.contenedor{
    width:90%;
    max-width:650px;
    text-align:center;
    z-index:2;
}

.carta{
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:30px;
    box-shadow:0 0 40px rgba(255,255,255,.3);
    border:1px solid rgba(255,255,255,.3);
}

h1{
    color:white;
    margin-bottom:20px;
    font-size:2.5rem;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

#mensaje{
    color:white;
    font-size:1.25rem;
    line-height:1.9;
    min-height:220px;
    margin-bottom:25px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4f8b;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

.corazon{
    position:absolute;
    font-size:25px;
    animation:subir linear forwards;
    pointer-events:none;
}

@keyframes subir{
    0%{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120px) scale(1.5);
        opacity:0;
    }
}

#final{
    display:none;
    color:white;
    font-size:1.6rem;
    margin-top:20px;
    animation:aparecer 2s forwards;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="contenedor">
    <div class="carta">

        <h1>❤️ Para Ti ❤️</h1>

        <div id="mensaje">
            Desde que llegaste a mi vida todo se siente diferente. 
            Hay algo en ti que hace que mis días sean más bonitos, 
            mis sonrisas más sinceras y mis pensamientos siempre terminen buscándote.
        </div>

        <button onclick="siguienteMensaje()">
            Presiona aquí 💌
        </button>

        <div id="final">
            💖 Te escogería una y mil veces más. 💖
        </div>

    </div>
</div>

<script>

const mensajes = [

`Hay muchas personas en el mundo, pero ninguna logra hacerme sentir lo que tú haces. Tu forma de ser, tu sonrisa y cada pequeño detalle tuyo tienen un lugar especial en mi corazón.`,

`Me gusta hablar contigo, pensar en ti, imaginar momentos contigo y descubrir nuevas razones para quererte cada día un poco más.`,

`Si me preguntaran cuál es mi lugar favorito, probablemente respondería que cualquier lugar donde estés tú.`,

`A veces me sorprendo sonriendo sin razón... y luego recuerdo que estaba pensando en ti.`,

`Eres de esas personas que llegan sin avisar y terminan convirtiéndose en una de las cosas más bonitas que le pueden pasar a alguien.`,

`No quiero prometer cosas imposibles, pero sí puedo prometer que siempre tendrás un lugar muy especial dentro de mí.`,

`💖 Gracias por existir. Gracias por ser tú. 💖`
];

let indice = 0;

function siguienteMensaje(){

    if(indice < mensajes.length){
        document.getElementById("mensaje").innerHTML = mensajes[indice];
        indice++;
    }else{
        document.getElementById("final").style.display="block";
    }
}

function crearCorazon(){

    const corazon=document.createElement("div");

    corazon.classList.add("corazon");

    const emojis=["💖","💕","💗","💘","💝","❤️"];

    corazon.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

    corazon.style.left=Math.random()*window.innerWidth+"px";

    corazon.style.animationDuration=(4+Math.random()*4)+"s";

    document.body.appendChild(corazon);

    setTimeout(()=>{
        corazon.remove();
    },8000);
}

setInterval(crearCorazon,250);

</script>

</body>
</html>
